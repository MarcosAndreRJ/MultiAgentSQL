<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Architect — MultiAgentSQL</title>
  <meta name="description" content="Dashboard administrativo e operacional do MultiAgentSQL. Gerencie agentes, providers de LLM, modelos e monitore a saúde do sistema." />

  <!-- CSS Modular -->
  <link rel="stylesheet" href="/public/css/base.css" />
  <link rel="stylesheet" href="/public/css/layout.css" />
  <link rel="stylesheet" href="/public/css/components.css" />
  <link rel="stylesheet" href="/public/css/workspace.css" />
  <link rel="stylesheet" href="/public/css/sentinel.css" />

  <!-- Marked.js para markdown no chat -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
<body>

<div id="app">

  <!-- ═══════════════════════════════════════════════════════
       SIDEBAR ESQUERDA (Permanente)
  ═══════════════════════════════════════════════════════ -->
  <aside id="sidebar">

    <!-- Logo -->
    <div class="sidebar-header">
      <span class="sidebar-logo-icon">⚡</span>
      <span class="sidebar-logo-text">Agent Architect</span>
      <span class="sidebar-logo-version">v2</span>
    </div>

    <!-- Navegação gerada pelo sidebar.js -->
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- Preenchido dinamicamente por /js/components/sidebar.js -->
    </nav>

    <!-- Footer da sidebar -->
    <div class="sidebar-footer">
      <button class="nav-item" id="btn-settings" style="width:100%;">
        <span class="nav-icon">⚙️</span>
        <span>Configurações</span>
      </button>
    </div>

  </aside>

  <!-- ═══════════════════════════════════════════════════════
       ÁREA CENTRAL — Muda conforme a rota
  ═══════════════════════════════════════════════════════ -->
  <main id="main-content">
    <!-- Preenchido dinamicamente pelo router em /js/app.js -->
    <div class="empty-state" style="margin:auto;">
      <span class="spinner"></span>
      <span class="text-muted">Inicializando...</span>
    </div>
  </main>

  <!-- ═══════════════════════════════════════════════════════
       RIGHT PANEL — Contexto da view ativa
  ═══════════════════════════════════════════════════════ -->
  <aside id="right-panel" class="collapsed">
    <div id="right-panel-content">
      <!-- Preenchido dinamicamente pelas páginas -->
    </div>
  </aside>

</div><!-- /#app -->

<!-- ═══════════════════════════════════════════════════════
     TEMPLATES HTML NATIVOS (sem JS no markup)
     Usados via cloneTemplate() do dom.js
═══════════════════════════════════════════════════════ -->

<!-- Template: linha de tabela de Provider -->
<template id="tpl-provider-row">
  <tr>
    <td class="col-name"></td>
    <td class="col-url text-mono" style="font-size:11px;color:var(--ink-2)"></td>
    <td class="col-status"></td>
    <td class="col-actions">
      <button class="btn btn-sm btn-secondary btn-test">Testar</button>
      <button class="btn btn-sm btn-secondary btn-edit">Editar</button>
      <button class="btn btn-sm btn-danger btn-delete">Excluir</button>
    </td>
  </tr>
</template>

<!-- Template: linha de tabela de Model -->
<template id="tpl-model-row">
  <tr>
    <td class="col-model-name text-mono"></td>
    <td class="col-provider"></td>
    <td class="col-context" style="font-size:11px;color:var(--ink-2)"></td>
    <td class="col-tools"></td>
  </tr>
</template>

<!-- Template: linha de tabela de Agent -->
<template id="tpl-agent-row">
  <tr>
    <td class="col-agent-id text-mono" style="font-size:11px;"></td>
    <td class="col-agent-name"></td>
    <td class="col-agent-model" style="font-size:11px;color:var(--ink-2)"></td>
    <td class="col-actions">
      <button class="btn btn-sm btn-secondary btn-edit">Editar</button>
      <button class="btn btn-sm btn-danger btn-delete">Excluir</button>
    </td>
  </tr>
</template>

<!-- Ponto de entrada ESM -->
<script type="module" src="/public/js/app.js"></script>

</body>
</html>
